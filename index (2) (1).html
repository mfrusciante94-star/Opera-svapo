<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miei Contatti NFC</title>
    <style>
        /* ==========================================================================
           CONFIGURAZIONE RAPIDA (Modifica qui i tuoi colori e lo sfondo)
           ========================================================================== */
        :root {
            /* Sfondo di apertura: puoi usare un gradiente, un colore fisso (es: #222222) o un'immagine url('link') */
            --background-style: linear-gradient(https://www.facebook.com/p/Opera-Svapo-61559297753584/);
            
            /* Colori del box e dei testi */
            --card-background: rgba(255, 255, 255, 0.95);
            --text-color: #333333;
            
            /* Colori dei pulsanti */
            --whatsapp-color: #25D366;
            --instagram-color: #E1306C;
            --maps-color: #4285F4;
        }

        /* ==========================================================================
           STILI STRUTTURALI (Non toccare se non vuoi modificare il layout)
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--background-style);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-background);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-color);
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
        }

        .links-flex {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
        }

        .btn-instagram {
            background-color: var(--instagram-color);
        }

        .btn-maps {
            background-color: var(--maps-color);
        }

        .btn svg {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
